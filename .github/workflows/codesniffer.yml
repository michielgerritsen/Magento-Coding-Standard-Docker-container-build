name: Magento Coding Standard Docker container build
on:
  workflow_dispatch:
  push:
    branches:
    - master

  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the test image
      uses: docker/build-push-action@v6
      with:
        context: codesniffer
        load: true
        build-args: |
          CACHEBUST=${{ github.run_id }}
        tags: michielgerritsen/magento-coding-standard:test

    - name: Test the image
      run: ./test/run.sh michielgerritsen/magento-coding-standard:test

    - name: Docker hub login
      if: github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set the date tag
      run: echo "DATE_TAG=$(date +%Y%m%d)" >> "$GITHUB_ENV"

    - name: Build and push the Docker image
      uses: docker/build-push-action@v6
      with:
        context: codesniffer
        platforms: linux/amd64,linux/arm64
        push: ${{ github.ref == 'refs/heads/master' }}
        build-args: |
          CACHEBUST=${{ github.run_id }}
        tags: |
          michielgerritsen/magento-coding-standard:latest
          michielgerritsen/magento-coding-standard:${{ env.DATE_TAG }}
